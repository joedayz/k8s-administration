# Pod 1: CrashLoopBackOff — el comando falla intencionalmente
apiVersion: v1
kind: Pod
metadata:
  name: pod-crash
  namespace: troubleshooting
  labels:
    escenario: crashloop
spec:
  containers:
  - name: crash
    image: busybox:1.36
    command: ["sh", "-c", "echo 'Iniciando...'; sleep 2; echo 'ERROR FATAL'; exit 1"]
    resources:
      requests:
        cpu: "10m"
        memory: "16Mi"
  restartPolicy: Always
---
# Pod 2: ImagePullBackOff — imagen que no existe
apiVersion: v1
kind: Pod
metadata:
  name: pod-imagen-mala
  namespace: troubleshooting
  labels:
    escenario: imagepull
spec:
  containers:
  - name: app
    image: nginx:version-inexistente-9999
    resources:
      requests:
        cpu: "10m"
        memory: "16Mi"
---
# Pod 3: OOMKilled — consume más memoria de su límite
apiVersion: v1
kind: Pod
metadata:
  name: pod-oom
  namespace: troubleshooting
  labels:
    escenario: oom
spec:
  containers:
  - name: memoria
    image: polinux/stress
    command: ["stress"]
    args: ["--vm", "1", "--vm-bytes", "150M", "--vm-hang", "1"]
    resources:
      requests:
        memory: "64Mi"
      limits:
        memory: "100Mi"   # límite más bajo que lo que consume: OOMKilled
---
# Pod 4: Pending — recursos imposibles de satisfacer
apiVersion: v1
kind: Pod
metadata:
  name: pod-pending
  namespace: troubleshooting
  labels:
    escenario: pending
spec:
  containers:
  - name: app
    image: nginx:alpine
    resources:
      requests:
        cpu: "99"       # 99 cores — ningún nodo tiene esto
        memory: "100Gi"
---
# Pod 5: Con finalizer — quedará atascado en Terminating
apiVersion: v1
kind: Pod
metadata:
  name: pod-finalizer
  namespace: troubleshooting
  labels:
    escenario: terminating
  finalizers:
  - "ejemplo.io/mi-finalizer"   # finalizer que nadie va a limpiar
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      requests:
        cpu: "10m"
        memory: "16Mi"
