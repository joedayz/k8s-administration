apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: permitir-interno
  namespace: net-debug
spec:
  podSelector: {}       # aplica a todos los pods del namespace
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: net-debug
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: net-debug
  # Permitir DNS (kube-system)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
