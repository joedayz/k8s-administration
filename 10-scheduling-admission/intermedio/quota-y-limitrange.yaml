apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota-pods
  namespace: quota-demo
spec:
  hard:
    pods: "2"
    requests.cpu: "500m"
    requests.memory: "256Mi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: limits-default
  namespace: quota-demo
spec:
  limits:
  - default:
      cpu: "100m"
      memory: "128Mi"
    defaultRequest:
      cpu: "50m"
      memory: "64Mi"
    type: Container
