apiVersion: v1
kind: Pod
metadata:
  name: pod-sin-asignar
  namespace: scheduling-admission
  labels:
    app: manual-schedule
spec:
  # Sin nodeName: este pod se queda Pending a propósito,
  # para que lo asignemos nosotros mismos vía la Binding API.
  schedulerName: no-schedule-manual
  containers:
  - name: nginx
    image: nginx:alpine
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
