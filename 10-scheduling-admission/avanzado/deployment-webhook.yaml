apiVersion: apps/v1
kind: Deployment
metadata:
  name: admission-webhook
  namespace: webhook-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admission-webhook
  template:
    metadata:
      labels:
        app: admission-webhook
    spec:
      containers:
      - name: webhook
        image: python:3.12-alpine
        command: ["python3", "/app/webhook_server.py"]
        ports:
        - containerPort: 8443
        volumeMounts:
        - name: certs
          mountPath: /certs
        - name: code
          mountPath: /app
      volumes:
      - name: certs
        secret:
          secretName: webhook-tls
      - name: code
        configMap:
          name: webhook-server-code
---
apiVersion: v1
kind: Service
metadata:
  name: admission-webhook
  namespace: webhook-system
spec:
  selector:
    app: admission-webhook
  ports:
  - port: 443
    targetPort: 8443
