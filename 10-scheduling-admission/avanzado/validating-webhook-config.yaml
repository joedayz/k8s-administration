apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: prohibir-tag-latest
webhooks:
- name: prohibir-tag-latest.webhook-system.svc
  admissionReviewVersions: ["v1"]
  sideEffects: None
  failurePolicy: Fail
  timeoutSeconds: 5
  clientConfig:
    service:
      name: admission-webhook
      namespace: webhook-system
      path: /validate
      port: 443
    caBundle: CA_BUNDLE_PLACEHOLDER
  rules:
  - apiGroups: [""]
    apiVersions: ["v1"]
    operations: ["CREATE"]
    resources: ["pods"]
  # Solo vigila el namespace de pruebas — NUNCA registres un webhook
  # sin namespaceSelector que lo excluya a sí mismo (ver Paso 5 del README).
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: vap-demo
