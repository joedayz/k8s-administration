apiVersion: v1
kind: Pod
metadata:
  name: pod-seguro
  namespace: desarrollo
spec:
  # SecurityContext a nivel de pod
  securityContext:
    runAsNonRoot: true        # prohíbe correr como root
    runAsUser: 1000           # UID del proceso
    runAsGroup: 3000          # GID del proceso
    fsGroup: 2000             # GID para acceso a volúmenes
    seccompProfile:
      type: RuntimeDefault    # perfil seccomp por defecto del runtime
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      # SecurityContext a nivel de container
      securityContext:
        allowPrivilegeEscalation: false   # no puede obtener más privilegios
        readOnlyRootFilesystem: true      # sistema de archivos de solo lectura
        capabilities:
          drop:
            - ALL    # elimina todas las capabilities de Linux
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
      volumeMounts:
        - name: tmp
          mountPath: /tmp    # único directorio escribible
  volumes:
    - name: tmp
      emptyDir: {}
