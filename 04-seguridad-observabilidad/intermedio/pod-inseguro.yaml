apiVersion: v1
kind: Pod
metadata:
  name: pod-inseguro
  namespace: desarrollo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      # Sin SecurityContext = corre como root, puede escribir en cualquier lado
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
