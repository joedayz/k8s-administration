apiVersion: v1
kind: Pod
metadata:
  name: pod-stress
  namespace: default
  labels:
    app: stress-test
spec:
  containers:
    - name: stress
      image: polinux/stress:latest
      # Consumir 200MB de memoria para disparar alertas
      command: ["stress"]
      args: ["--vm", "1", "--vm-bytes", "200M", "--timeout", "300s"]
      resources:
        requests:
          cpu: "100m"
          memory: "100Mi"
        limits:
          cpu: "200m"
          memory: "256Mi"
  restartPolicy: Never
