apiVersion: v1
kind: ConfigMap
metadata:
  name: datos-importantes
  namespace: backup-test
data:
  configuracion: |
    entorno=produccion
    version=2.1.0
    max_conexiones=100
  notas: "Este ConfigMap es el que restauraremos desde backup"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-backup-test
  namespace: backup-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backup-test
  template:
    metadata:
      labels:
        app: backup-test
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        resources:
          requests:
            cpu: "20m"
            memory: "32Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: app-backup-test
  namespace: backup-test
spec:
  selector:
    app: backup-test
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: v1
kind: Secret
metadata:
  name: credenciales-backup
  namespace: backup-test
type: Opaque
stringData:
  usuario: "admin-backup"
  password: "secreto-recuperado"
