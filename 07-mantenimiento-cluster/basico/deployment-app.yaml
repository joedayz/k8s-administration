apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-mantenimiento
  namespace: mantenimiento
spec:
  replicas: 6
  selector:
    matchLabels:
      app: app-mantenimiento
  template:
    metadata:
      labels:
        app: app-mantenimiento
    spec:
      # Preferir distribución entre nodos
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - app-mantenimiento
              topologyKey: kubernetes.io/hostname
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "20m"
            memory: "32Mi"
          limits:
            cpu: "50m"
            memory: "64Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
