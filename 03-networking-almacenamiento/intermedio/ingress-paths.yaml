apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: desarrollo
  annotations:
    # Traefik (k3s) usa estas anotaciones
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: app.lab.local
      http:
        paths:
          - path: /frontend
            pathType: Prefix
            backend:
              service:
                name: app-frontend-svc
                port:
                  number: 80
          - path: /backend
            pathType: Prefix
            backend:
              service:
                name: app-backend-v2-svc
                port:
                  number: 80
