# Misma provisioner de k3s (rancher.io/local-path), distinta política de retención.
# Immediate crea el PV al crear el PVC, sin esperar un pod.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path-retain
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: Immediate
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path-delete
provisioner: rancher.io/local-path
reclaimPolicy: Delete
volumeBindingMode: Immediate
