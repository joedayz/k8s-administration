apiVersion: v1
kind: Pod
metadata:
  name: pod-storage
  namespace: desarrollo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "while true; do sleep 3600; done"]
      volumeMounts:
        - name: datos
          mountPath: /datos
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
  volumes:
    - name: datos
      persistentVolumeClaim:
        claimName: datos-app
