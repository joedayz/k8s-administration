# Valores personalizados para Redis en producción
# Uso: helm install redis-cache bitnami/redis -n produccion -f helm-redis-values.yaml

architecture: standalone   # standalone o replication

auth:
  enabled: true
  password: "CambiarEnProduccion123!"   # en producción usar Sealed Secrets o Vault

master:
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

metrics:
  enabled: true   # expone métricas para Prometheus
