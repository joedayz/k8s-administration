apiVersion: batch/v1
kind: Job
metadata:
  name: job-procesamiento
  namespace: produccion
  labels:
    app: procesamiento
spec:
  completions: 6      # total de tareas a completar
  parallelism: 2      # cuántas corren en paralelo
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: procesamiento
    spec:
      restartPolicy: OnFailure
      containers:
        - name: procesador
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Procesando tarea en pod: $HOSTNAME"
              sleep $((RANDOM % 10 + 5))
              echo "Tarea completada en: $HOSTNAME"
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
