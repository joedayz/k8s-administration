# Simulacro CKA II — app crítica con un PDB demasiado estricto (namespace cka2-ops)
apiVersion: v1
kind: Namespace
metadata:
  name: cka2-ops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: critico
  namespace: cka2-ops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: critico
  template:
    metadata:
      labels:
        app: critico
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: critico
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 2
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: critico
  namespace: cka2-ops
spec:
  type: NodePort
  selector:
    app: critico
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30100
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: critico-pdb
  namespace: cka2-ops
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: critico
