# Simulacro CKA II — cliente DNS para el Reto 2 (namespace cka2-dns)
# Ojo: este Deployment trae su propio fallo de DNS además de los que se rompen en kube-system.
apiVersion: v1
kind: Namespace
metadata:
  name: cka2-dns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cka2-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: cka2-dns
spec:
  selector:
    app: backend
  ports:
  - port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cliente
  namespace: cka2-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cliente
  template:
    metadata:
      labels:
        app: cliente
    spec:
      dnsPolicy: Default
      containers:
      - name: curl
        image: curlimages/curl:8.11.1
        command: ["sh", "-c", "while true; do curl -s -m 2 -o /dev/null -w '%{http_code}\\n' http://backend || echo FALLO; sleep 5; done"]
