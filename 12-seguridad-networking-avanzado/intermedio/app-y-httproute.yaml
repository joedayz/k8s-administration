apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-gateway-demo
  namespace: gateway-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-gateway-demo
  template:
    metadata:
      labels:
        app: app-gateway-demo
    spec:
      containers:
      - name: whoami
        image: traefik/whoami
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app-gateway-demo
  namespace: gateway-demo
spec:
  selector:
    app: app-gateway-demo
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ruta-app-demo
  namespace: gateway-demo
spec:
  parentRefs:
  - name: gateway-demo
  hostnames:
  - "demo.gateway.local"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: app-gateway-demo
      port: 80
