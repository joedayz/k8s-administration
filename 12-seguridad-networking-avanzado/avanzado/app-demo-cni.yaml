apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-demo-cni
  namespace: cni-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-demo-cni
  template:
    metadata:
      labels:
        app: app-demo-cni
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app-demo-cni
  namespace: cni-demo
spec:
  selector:
    app: app-demo-cni
  ports:
  - port: 80
    targetPort: 80
