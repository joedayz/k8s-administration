apiVersion: v1
kind: Pod
metadata:
  name: backend-redis
  namespace: lifecycle-patrones
  labels:
    app: backend-redis
spec:
  containers:
  - name: redis
    image: redis:7-alpine
    ports:
    - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: backend-redis
  namespace: lifecycle-patrones
spec:
  selector:
    app: backend-redis
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: v1
kind: Pod
metadata:
  name: patron-ambassador
  namespace: lifecycle-patrones
spec:
  containers:
  - name: app-principal
    image: redis:7-alpine
    # La app solo conoce localhost:6380 — nunca el nombre real del backend.
    command: ['sh', '-c', 'sleep 10; redis-cli -h 127.0.0.1 -p 6380 set saludo "hola-desde-la-app"; redis-cli -h 127.0.0.1 -p 6380 get saludo; sleep 3600']
  - name: ambassador
    image: alpine/socat
    args: ["TCP-LISTEN:6380,fork,reuseaddr", "TCP:backend-redis:6379"]
