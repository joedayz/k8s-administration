apiVersion: v1
kind: Pod
metadata:
  name: pod-resizable
  namespace: lifecycle-patrones
spec:
  containers:
  - name: app
    image: nginx:alpine
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"
    # NotRequired le dice a kubelet que intente aplicar el cambio sin
    # reiniciar el contenedor cuando se redimensione en caliente.
    resizePolicy:
    - resourceName: cpu
      restartPolicy: NotRequired
    - resourceName: memory
      restartPolicy: NotRequired
