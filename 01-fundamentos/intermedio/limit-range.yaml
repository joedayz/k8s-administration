apiVersion: v1
kind: LimitRange
metadata:
  name: limits-produccion
  namespace: produccion
spec:
  limits:
    - type: Container
      default:           # límites por defecto si el pod no los declara
        cpu: "500m"
        memory: "256Mi"
      defaultRequest:    # requests por defecto
        cpu: "100m"
        memory: "128Mi"
      max:               # máximo que puede pedir un container
        cpu: "2"
        memory: "1Gi"
      min:               # mínimo obligatorio
        cpu: "50m"
        memory: "64Mi"
