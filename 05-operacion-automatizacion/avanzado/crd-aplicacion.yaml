apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aplicaciones.labs.k8s.io
spec:
  group: labs.k8s.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                imagen:
                  type: string
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 10
                entorno:
                  type: string
                  enum: ["desarrollo", "staging", "produccion"]
              required: ["imagen", "replicas", "entorno"]
      additionalPrinterColumns:
        - name: Imagen
          type: string
          jsonPath: .spec.imagen
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Entorno
          type: string
          jsonPath: .spec.entorno
  scope: Namespaced
  names:
    plural: aplicaciones
    singular: aplicacion
    kind: Aplicacion
    shortNames:
      - app-crd
