apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  # El grupo NO puede terminar en ".k8s.io" ni ".kubernetes.io": esos
  # sufijos están reservados para el propio proyecto Kubernetes y el
  # API server exige una anotación de aprobación que no tenemos. Se usa
  # un dominio propio, como recomienda la documentación oficial.
  name: aplicaciones.labs.example.com
spec:
  group: labs.example.com
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                imagen:
                  type: string
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 10
                entorno:
                  type: string
                  enum: ["desarrollo", "staging", "produccion"]
              required: ["imagen", "replicas", "entorno"]
      additionalPrinterColumns:
        - name: Imagen
          type: string
          jsonPath: .spec.imagen
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Entorno
          type: string
          jsonPath: .spec.entorno
  scope: Namespaced
  names:
    plural: aplicaciones
    singular: aplicacion
    kind: Aplicacion
    shortNames:
      - app-crd
