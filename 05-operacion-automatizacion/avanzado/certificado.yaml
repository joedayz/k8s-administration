apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: app-tls-cert
  namespace: desarrollo
spec:
  secretName: app-tls-cert   # cert-manager crea este Secret automáticamente
  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
  commonName: app.lab.local
  dnsNames:
    - app.lab.local
    - "*.app.lab.local"
  duration: 2160h    # 90 días
  renewBefore: 360h  # renovar 15 días antes de expirar
