apiVersion: v1
kind: Namespace
metadata:
  name: velero
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: velero
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          # minio/minio:latest ya no se puede descargar de Docker Hub (el
          # proyecto fue archivado en 2026); usamos el mirror de bitnami
          # legacy, igual que el ejemplo oficial de Velero.
          image: bitnamilegacy/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: "minio"
            - name: MINIO_ROOT_PASSWORD
              value: "minio123"
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: velero
spec:
  selector:
    app: minio
  ports:
    - port: 9000
      name: api
    - port: 9001
      name: console
---
# Crea el bucket "velero-backups" una vez que MinIO está arriba.
# Se usa un Job (no un initContainer del mismo pod) porque los
# initContainers corren ANTES que el contenedor principal: intentar
# conectarse a MinIO ahí siempre fallaría. El Job reintenta
# (restartPolicy: OnFailure) hasta que el Service "minio" responda.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-setup
  namespace: velero
spec:
  template:
    metadata:
      name: minio-setup
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: bitnamilegacy/minio-client:latest
          command:
            - sh
            - -c
            - |
              mc alias set local http://minio.velero.svc.cluster.local:9000 minio minio123 && \
              mc mb local/velero-backups --ignore-existing
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
