apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch-processor
  namespace: scheduling
spec:
  replicas: 3
  selector:
    matchLabels:
      app: batch-processor
  template:
    metadata:
      labels:
        app: batch-processor
    spec:
      priorityClassName: batch-jobs
      containers:
      - name: worker
        image: busybox:1.36
        command: ["sh", "-c", "while true; do echo processing...; sleep 10; done"]
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
