apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-critica
  namespace: scheduling
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-critica
  template:
    metadata:
      labels:
        app: api-critica
    spec:
      priorityClassName: critico
      containers:
      - name: api
        image: nginx:alpine
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
