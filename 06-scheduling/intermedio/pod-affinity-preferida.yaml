apiVersion: v1
kind: Pod
metadata:
  name: pod-affinity-preferida
  namespace: scheduling
spec:
  affinity:
    nodeAffinity:
      # PREFERRED: intenta zona=interna pero no falla si no puede
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 80
        preference:
          matchExpressions:
          - key: zona
            operator: In
            values:
            - interna
      - weight: 20
        preference:
          matchExpressions:
          - key: zona
            operator: In
            values:
            - dmz
  containers:
  - name: app
    image: nginx:alpine
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"
