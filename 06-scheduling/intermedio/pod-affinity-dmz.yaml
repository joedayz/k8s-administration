apiVersion: v1
kind: Pod
metadata:
  name: pod-affinity-dmz
  namespace: scheduling
spec:
  affinity:
    nodeAffinity:
      # REQUIRED: el pod no arranca si no hay nodo con zona=dmz
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: zona
            operator: In
            values:
            - dmz
  containers:
  - name: app
    image: nginx:alpine
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"
