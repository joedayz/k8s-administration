apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-collector
  namespace: scheduling
  labels:
    app: log-collector
spec:
  selector:
    matchLabels:
      app: log-collector
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: log-collector
    spec:
      # Solo en workers: excluye el control-plane
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: collector
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          while true; do
            echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] $(hostname): collecting logs..."
            sleep 60
          done
        resources:
          requests:
            cpu: "10m"
            memory: "16Mi"
          limits:
            cpu: "50m"
            memory: "32Mi"
        # Monta los logs del host para leerlos
        volumeMounts:
        - name: varlog
          mountPath: /var/log/host
          readOnly: true
      volumes:
      - name: varlog
        hostPath:
          path: /var/log
          type: Directory
