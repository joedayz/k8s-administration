apiVersion: v1
kind: Pod
metadata:
  name: pod-sin-toleracion
  namespace: scheduling
  labels:
    app: web
    tier: frontend
spec:
  containers:
  - name: nginx
    image: nginx:alpine
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"
  # Sin tolerations — el scheduler evitará k3s-worker (tainteado con tier=frontend:NoSchedule)
