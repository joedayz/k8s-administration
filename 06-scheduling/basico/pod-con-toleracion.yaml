apiVersion: v1
kind: Pod
metadata:
  name: pod-con-toleracion
  namespace: scheduling
  labels:
    app: web
    tier: frontend
spec:
  tolerations:
  - key: "tier"
    operator: "Equal"
    value: "frontend"
    effect: "NoSchedule"
  containers:
  - name: nginx
    image: nginx:alpine
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"
